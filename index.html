<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="Estilos/style.css">
    <link rel="stylesheet" href="Estilos/media.css">
    <title>Login</title> 
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo novamente.
                    Faça login para acessar sua conta
                </p>
                <form action="login.php" method="post" autocomplete="on">

                    <div class="campo">
                       <span id="person" class="material-symbols-outlined">person</span>
                        <input type="email" name="email" id="iemail" placeholder="Seu e-mail" autocomplete="email" required maxlength="30">
                         <label for="login">Login</label>
                    </div>

                    <div class="campo">
                      <span id="pin" class="material-symbols-outlined">pin</span>
                        <input type="password" name="senha" id="isenha" placeholder="Sua senha" autocomplete="current-password" required minlength="8" maxlength="12">
                         <label for="Senha">Senha</label>
                    </div>
                    <input type="submit" value="Entrar">
                    <a href="Esqueci.html">Esqueci a senha</a>
                </form>

            </div>

        </section>
    </main>
    
</body>
</html>
